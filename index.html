<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển thị Địa chỉ IP Người Truy Cập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #333;
        }
        .ip-box {
            font-size: 20px;
            color: #007bff;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Thông tin Truy Cập của Bạn</h2>
        <p>Địa chỉ IP của bạn là:</p>
        <div class="ip-box" id="ip-address">Đang tải...</div>
    </div>

    <script>
        // Gọi API để lấy địa chỉ IP công khai của người truy cập
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip-address').innerText = data.ip;
            })
            .catch(error => {
                document.getElementById('ip-address').innerText = 'Không thể tải địa chỉ IP';
                console.error('Lỗi:', error);
            });
    </script>

</body>
</html>
