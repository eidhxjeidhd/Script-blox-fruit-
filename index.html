<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruit Script Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
        }

        /* Hiệu ứng chữ 7 màu chạy */
        @keyframes rainbow {
            0% { color: #ff0000; }
            14% { color: #ff7f00; }
            28% { color: #ffff00; }
            42% { color: #00ff00; }
            57% { color: #0000ff; }
            71% { color: #4b0082; }
            85% { color: #8b00ff; }
            100% { color: #ff0000; }
        }

        @keyframes borderRainbow {
            0% { border-color: #ff0000; }
            14% { border-color: #ff7f00; }
            28% { border-color: #ffff00; }
            42% { border-color: #00ff00; }
            57% { border-color: #0000ff; }
            71% { border-color: #4b0082; }
            85% { border-color: #8b00ff; }
            100% { border-color: #ff0000; }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        header h1 {
            font-size: 24px;
            font-weight: bold;
            animation: rainbow 5s infinite;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        header p {
            color: #8f9bb3;
            font-size: 14px;
        }

        /* Nút đăng nhập Admin nhỏ gọn góc trên */
        .admin-login-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #2d3748;
            color: #a0aec0;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
        }

        .admin-login-btn.active {
            background: #28a745;
            color: white;
        }

        /* Form đóng góp script */
        .form-container {
            background: #181b28;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid #333;
            animation: borderRainbow 8s infinite;
        }

        .form-container h3 {
            font-size: 16px;
            margin-bottom: 10px;
            animation: rainbow 5s infinite;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0f111a;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            height: 70px;
            font-family: monospace;
        }

        .btn-submit {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #0056b3;
        }

        /* Thẻ Script Card */
        .script-card {
            background: #181b28;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2d3748;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .script-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .lua-label {
            font-size: 12px;
            color: #a0aec0;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-copy {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Nút Xóa dành riêng cho Admin */
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* Mặc định ẩn, chỉ hiện khi bật Admin */
        }

        .code-box {
            background: #0f111a;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #d1d5db;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <button id="adminBtn" class="admin-login-btn" onclick="toggleAdmin()">Admin Mode</button>
        <h1>Blox Fruit Script Hub</h1>
        <p>Kho lưu trữ script miễn phí - Cộng đồng tự do chia sẻ</p>
    </header>

    <!-- Form đóng góp script -->
    <div class="form-container">
        <h3>+ Đóng Góp Script Mới</h3>
        <div class="form-group" style="margin-top: 10px;">
            <input type="text" id="scriptName" placeholder="Tên script (VD: Raito Hub - Auto Farm)...">
        </div>
        <div class="form-group">
            <textarea id="scriptCode" placeholder="Dán mã LUA vào đây (loadstring(...))..."></textarea>
        </div>
        <button class="btn-submit" onclick="addNewScript()">Đăng Script Ngay</button>
    </div>

    <!-- Danh sách hiển thị script -->
    <div id="scriptList"></div>

    <script>
        // Mật khẩu Admin mặc định (Bạn có thể đổi chữ 'admin123' thành mật khẩu bạn muốn)
        const ADMIN_PASSWORD = "admin123";
        let isAdmin = false;

        // Dữ liệu mẫu ban đầu (Được gán ID để quản lý xóa)
        let defaultScripts = [
            { id: 'def_1', name: "❄️ Speed Hub X Blox Fruit – Keyless, ESP, Speed Hack", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ahmadhalabi2/Speed-Hub-X/main/Speed%20Hub%20X.lua"))()' },
            { id: 'def_2', name: "❄️ Raito Hub Blox Fruit - Auto Chest, Sea Event", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/native-cam/RaitoHub/main/Script"))()' }
        ];

        window.onload = function() {
            renderScripts();
        }

        // Bật/Tắt chế độ Admin bằng mật khẩu
        function toggleAdmin() {
            if (!isAdmin) {
                let pass = prompt("Nhập mật khẩu Admin:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminBtn').innerText = "Admin: ON";
                    document.getElementById('adminBtn').classList.add('active');
                    alert("Đã bật quyền Admin thành công! Nút xóa đã hiển thị.");
                    renderScripts();
                } else if (pass !== null) {
                    alert("Sai mật khẩu!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminBtn').innerText = "Admin Mode";
                document.getElementById('adminBtn').classList.remove('active');
                alert("Đã tắt quyền Admin.");
                renderScripts();
            }
        }

        // Hàm thêm script mới
        function addNewScript() {
            const name = document.getElementById('scriptName').value.trim();
            const code = document.getElementById('scriptCode').value.trim();

            if (!name || !code) {
                alert("Vui lòng nhập đầy đủ tên và mã script!");
                return;
            }

            const newScript = { 
                id: 'user_' + Date.now(), 
                name: name, 
                code: code 
            };
            
            let userScripts = JSON.parse(localStorage.getItem('custom_scripts')) || [];
            userScripts.unshift(newScript);
            localStorage.setItem('custom_scripts', JSON.stringify(userScripts));

            document.getElementById('scriptName').value = '';
            document.getElementById('scriptCode').value = '';
            renderScripts();
            alert("Đã đăng script thành công!");
        }

        // Hàm xóa script theo ID
        function deleteScript(id) {
            if (!confirm("Bạn có chắc chắn muốn xóa script này không?")) return;

            // Kiểm tra xem có phải script mặc định không
            let defIndex = defaultScripts.findIndex(item => item.id === id);
            if (defIndex !== -1) {
                defaultScripts.splice(defIndex, 1);
            } else {
                // Xóa trong LocalStorage của script người dùng
                let userScripts = JSON.parse(localStorage.getItem('custom_scripts')) || [];
                userScripts = userScripts.filter(item => item.id !== id);
                localStorage.setItem('custom_scripts', JSON.stringify(userScripts));
            }

            renderScripts();
        }

        // Hiển thị toàn bộ danh sách ra giao diện
        function renderScripts() {
            const container = document.getElementById('scriptList');
            let userScripts = JSON.parse(localStorage.getItem('custom_scripts')) || [];
            
            // Kết hợp script mặc định và script người dùng đóng góp
            let allScripts = [...defaultScripts, ...userScripts];

            if (allScripts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #718096;">Chưa có script nào trên hệ thống.</p>';
                return;
            }

            let html = '';
            allScripts.forEach(item => {
                let deleteBtnStyle = isAdmin ? 'display: inline-block;' : 'display: none;';
                html += `
                    <div class="script-card">
                        <div class="script-header-row">
                            <span class="script-title" style="font-size: 15px; font-weight: bold;">✨ ${escapeHtml(item.name)}</span>
                        </div>
                        <div class="script-header-row">
                            <span class="lua-label">LUA CODE:</span>
                            <div class="btn-group">
                                <button class="btn-copy" onclick="copyCode(this)">Copy</button>
                                <button class="btn-delete" style="${deleteBtnStyle}" onclick="deleteScript('${item.id}')">Xóa</button>
                            </div>
                        </div>
                        <div class="code-box">${escapeHtml(item.code)}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Hàm sao chép code
        function copyCode(button) {
            const codeBox = button.parentElement.parentElement.nextElementSibling;
            const textToCopy = codeBox.innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = button.innerText;
                button.innerText = "Copied!";
                button.style.backgroundColor = "#28a745";
                
                setTimeout(() => {
                    button.innerText = originalText;
                    button.style.backgroundColor = "#007bff";
                }, 1500);
            }).catch(err => {
                alert("Không thể sao chép!");
            });
        }

        // Chống lỗi ký tự đặc biệt HTML
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
